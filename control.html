<!-- control.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Timer Control</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      text-align: center;
    }
    input, button {
      font-size: 1.5rem;
      margin: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>Control Panel</h1>


  <div style="font-size:2rem; margin-bottom:1rem;">
    <span id="currentTaskName"></span>
    <span id="currentTaskTime" style="margin-left:2em;"></span>
  </div>
  <button onclick="send('pause')">Pause</button>
  <button onclick="send('resume')">Resume</button>
  <button onclick="send('reset')">Reset</button>
  <button onclick="send('prev')">Prev Task</button>
  <button onclick="send('next')">Next Task</button>
  <button onclick="send('queue_clear')">Clear Queue</button>
  <br><br>
  <button onclick="adjustTime(60)">+1 min</button>
  <button onclick="adjustTime(30)">+30 sec</button>
  <button onclick="adjustTime(-30)">-30 sec</button>
  <button onclick="adjustTime(-60)">-1 min</button>
  <input type="number" id="customAdjust" placeholder="±sec" style="width:6em;" />
  <button onclick="adjustTime(parseInt(document.getElementById('customAdjust').value)||0)">Adjust</button>
  <br><br>
  <a href="queue.html" style="font-size:1.2rem;">Open Queue Manager</a>


  <h2>Queue</h2>
  <table id="queueTable" border="1" style="margin:auto; min-width:400px;">
    <thead><tr><th>#</th><th>Name</th><th>Duration</th><th>Time Left</th><th>Actions</th></tr></thead>
    <tbody></tbody>
  </table>


  <h3>Add/Edit Timer</h3>
  <form id="addForm" onsubmit="addOrEditTimer(event)">
    <input type="hidden" id="editIndex" value="" />
    <input type="text" id="taskName" placeholder="Task name" required />
    <input type="number" id="taskDuration" placeholder="Duration (s)" required min="1" />
    <button type="submit">Add/Update</button>
    <button type="button" onclick="resetForm()">Cancel</button>
  </form>

  <script>
    const ws = new WebSocket("ws://" + location.hostname + ":50011");
    let queue = [];
    let currentTaskIndex = 0;


    let timerState = {remaining: 0, running: false};
    ws.onmessage = function(event) {
      const data = JSON.parse(event.data);
      queue = data.queue || [];
      currentTaskIndex = data.current_task_index || 0;
      timerState = {remaining: data.remaining, running: data.running};
      // Show current timer name and time at the top
      document.getElementById('currentTaskName').textContent = data.current_name ? data.current_name : '';
      document.getElementById('currentTaskTime').textContent = formatTime(data.remaining);
      renderQueue();
    };

    function send(cmd) {
      ws.send(cmd);
    }

    function formatTime(secs) {
      const sign = secs < 0 ? '-' : '';
      secs = Math.abs(secs);
      const m = String(Math.floor(secs/60)).padStart(2,'0');
      const s = String(secs%60).padStart(2,'0');
      return `${sign}${m}:${s}`;
    }

    function adjustTime(delta) {
      if (!delta) return;
      send('adjust ' + delta);
    }

    function renderQueue() {
      const tbody = document.querySelector('#queueTable tbody');
      tbody.innerHTML = '';
      queue.forEach((item, idx) => {
        const tr = document.createElement('tr');
        tr.style.background = idx === currentTaskIndex ? '#cfc' : '';
        let timeLeft;
        if (idx === currentTaskIndex) {
          timeLeft = formatTime(timerState.remaining);
        } else {
          timeLeft = formatTime(item.duration);
        }
        tr.innerHTML = `
          <td>${idx+1}</td>
          <td>${item.name}</td>
          <td>${item.duration}</td>
          <td>${timeLeft}</td>
          <td>
            <button onclick="editTimer(${idx})">Edit</button>
            <button onclick="deleteTimer(${idx})">Delete</button>
            <button onclick="selectTask(${idx})">Select</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addOrEditTimer(e) {
      e.preventDefault();
      const name = document.getElementById('taskName').value;
      const duration = document.getElementById('taskDuration').value;
      const editIndex = document.getElementById('editIndex').value;
      if (editIndex === '') {
        send(`queue_add ${name} ${duration}`);
      } else {
        // Remove old, add new at same index
        deleteTimer(editIndex, false);
        setTimeout(() => send(`queue_add ${name} ${duration}`), 100);
      }
      resetForm();
    }

    function editTimer(idx) {
      document.getElementById('editIndex').value = idx;
      document.getElementById('taskName').value = queue[idx].name;
      document.getElementById('taskDuration').value = queue[idx].duration;
    }

    function deleteTimer(idx, resetFormFlag = true) {
      queue.splice(idx, 1);
      // Clear and re-add all items to keep server in sync
      send('queue_clear');
      setTimeout(() => {
        queue.forEach(item => send(`queue_add ${item.name} ${item.duration}`));
      }, 100);
      if (resetFormFlag) resetForm();
    }

    function selectTask(idx) {
      // Move to selected task by sending next/prev as needed
      if (idx === currentTaskIndex) return;
      let diff = idx - currentTaskIndex;
      let cmd = diff > 0 ? 'next' : 'prev';
      for (let i = 0; i < Math.abs(diff); i++) send(cmd);
    }

    function resetForm() {
      document.getElementById('editIndex').value = '';
      document.getElementById('taskName').value = '';
      document.getElementById('taskDuration').value = '';
    }
  </script>
</body>
</html>
